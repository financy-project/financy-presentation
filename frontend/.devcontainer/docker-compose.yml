name: financy-web-dev

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: financy-web-dev
    ports:
      - '5173:5173'
    volumes:
      # Código fonte (desenvolvimento)
      - ..:/workspace
      # Credenciais e config (persistem entre restarts)
      - ~/.ssh:/home/node/.ssh:ro
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.git-credentials:/home/node/.git-credentials:ro
      - ~/.claude:/home/node/.claude
      # Cache de dependências (npm/pnpm)
      - node_modules_cache:/workspace/node_modules
      - pnpm_cache:/home/node/.pnpm-store
      - npm_cache:/home/node/.npm
      # Cache do sistema
      - home_cache:/home/node/.cache
    environment:
      NODE_ENV: development
    working_dir: /workspace
    user: node
    stdin_open: true
    tty: true

volumes:
  node_modules_cache:
  pnpm_cache:
  npm_cache:
  home_cache:
